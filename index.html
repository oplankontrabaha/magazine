<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oplan Kontra Baha</title>
<meta name="description" content="DPWH Oplan Kontra Baha — Project Monitoring, OKB Magazine, PDF export and regional waterway maps.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OKB">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F3A;--navy-2:#1a3d73;--orange:#F26522;--orange-2:#ff8a4c;
  --ink:#0B1F3A;--muted:#6b7a8c;--line:#e3e8ef;--paper:#ffffff;
  --shadow:0 10px 30px rgba(11,31,58,.14),0 2px 6px rgba(11,31,58,.08);
  --ease:cubic-bezier(.2,.8,.2,1);
  --sb:env(safe-area-inset-bottom,0px);--sr:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper)}
body{font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ---------- the live page fills everything ---------- */
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .5s var(--ease)}
#frame.ready{opacity:1}

/* the thin line that glides along the top while a page loads */
.loader{position:fixed;left:0;right:0;top:0;height:3px;z-index:30;overflow:hidden;opacity:0;transition:opacity .3s;pointer-events:none}
.loader.on{opacity:1}
.loader::after{content:'';position:absolute;top:0;left:0;width:34%;height:100%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--orange),transparent);animation:glide 1.15s var(--ease) infinite}
@keyframes glide{from{transform:translateX(-110%)}to{transform:translateX(330%)}}

.wait{
  position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:20;text-align:center;
  background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px 26px;min-width:250px;
  transition:opacity .35s var(--ease),transform .35s var(--ease);
}
.wait.off{opacity:0;transform:translate(-50%,-46%);pointer-events:none}
.wait .mark{width:44px;height:44px;border-radius:13px;margin:0 auto 12px;background:linear-gradient(135deg,var(--navy),var(--navy-2));display:grid;place-items:center;box-shadow:0 6px 14px rgba(11,31,58,.22)}
.wait .mark svg{width:26px;height:26px}
.wait .line{width:150px;height:3px;border-radius:3px;background:#edf1f5;margin:0 auto 12px;overflow:hidden}
.wait .line::after{content:'';display:block;width:42%;height:100%;border-radius:3px;background:var(--orange);animation:glide 1.05s var(--ease) infinite}
.wait .what{font-weight:600;font-size:14px;color:var(--navy)}
.wait .slow{font-size:12px;color:var(--muted);margin-top:8px;opacity:0;transition:opacity .4s}
.wait .slow.show{opacity:1}
.wait .slow button{color:var(--orange);font-weight:600;text-decoration:underline}

/* ---------- the corner button and its menu ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(11,31,58,0);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto;background:rgba(11,31,58,.10)}
.corner{position:fixed;right:calc(14px + var(--sr));bottom:calc(14px + var(--sb));z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{
  width:54px;height:54px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;
  box-shadow:0 10px 24px rgba(11,31,58,.30),0 2px 6px rgba(11,31,58,.18);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease),opacity .6s var(--ease);
}
.fab::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(242,101,34,.0);transition:border-color .4s,inset .4s}
.fab:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(11,31,58,.34)}
.fab:active{transform:scale(.95)}
.fab.dim{opacity:.68}
.fab:hover,.fab.open{opacity:1}
.fab.open{transform:rotate(90deg);background:linear-gradient(135deg,#e8571a,var(--orange-2));box-shadow:0 12px 26px rgba(242,101,34,.36)}
.fab svg{width:26px;height:26px;position:absolute;transition:opacity .25s var(--ease),transform .4s var(--ease)}
.fab .ic-x{opacity:0;transform:rotate(-90deg) scale(.6)}
.fab.open .ic-mark{opacity:0;transform:scale(.6)}
.fab.open .ic-x{opacity:1;transform:rotate(-90deg) scale(1)}

.menu{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.menu.open{pointer-events:auto}
.item{
  display:flex;align-items:center;gap:10px;padding:7px 12px 7px 7px;border-radius:999px;
  background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:13.5px;font-weight:500;color:var(--navy);white-space:nowrap;max-width:calc(100vw - 28px - var(--sr));
  opacity:0;transform:translateY(14px) scale(.96);transform-origin:right center;
  transition:opacity .32s var(--ease),transform .38s var(--ease),box-shadow .3s var(--ease),border-color .3s;
}
.menu.open .item{opacity:1;transform:none}
.item:hover{box-shadow:0 14px 32px rgba(11,31,58,.18);border-color:#cfd8e4}
.item:active{transform:scale(.98)}
.item .tile{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 10px rgba(11,31,58,.18)}
.item .tile svg{width:18px;height:18px}
.item .tile.navy{background:linear-gradient(135deg,var(--navy),var(--navy-2))}
.item .tile.orange{background:linear-gradient(135deg,#e8571a,var(--orange-2));box-shadow:0 4px 10px rgba(242,101,34,.26)}
.item .tile.gray{background:linear-gradient(135deg,#5c6b7d,#8795a7)}
.item .lbl{text-align:left;line-height:1.25;white-space:normal;max-width:230px}
.item .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);margin-left:2px;flex:none;box-shadow:0 0 0 3px rgba(242,101,34,.18);opacity:0;transition:opacity .3s}
.item.current{border-color:rgba(242,101,34,.45)}
.item.current .dot{opacity:1}
.item.sep{margin-top:4px}
.item[hidden]{display:none}

/* the little note that appears above the button on a first visit */
.bubble{
  max-width:250px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:10px 34px 10px 12px;font-size:12.5px;line-height:1.45;color:var(--ink);position:relative;
  opacity:0;transform:translateY(8px);transition:opacity .4s var(--ease),transform .4s var(--ease);pointer-events:none;
}
.bubble.on{opacity:1;transform:none;pointer-events:auto}
.bubble b{font-weight:600}
.bubble::after{content:'';position:absolute;right:20px;bottom:-6px;width:11px;height:11px;background:var(--paper);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble .x{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.bubble .x:hover{background:#f1f4f8}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="loader" id="loader"></div>

<div id="frameHost"></div>

<div class="wait" id="wait">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2.2 0 2.2-2 4.5-2s2.3 2 4.5 2 2.3-2 4.5-2 2.3 2 4.5 2"/><path d="M3 17c2.2 0 2.2-2 4.5-2s2.3 2 4.5 2 2.3-2 4.5-2 2.3 2 4.5 2" stroke="#F26522"/><path d="M8 7l4-4 4 4"/></svg></div>
  <div class="line"></div>
  <div class="what" id="waitWhat">Opening…</div>
  <div class="slow" id="waitSlow">Taking a while? <button id="waitOpen">Open in the browser instead</button></div>
</div>

<div class="scrim" id="scrim"></div>

<div class="corner">
  <div class="bubble" id="bubble" role="status">
    <span id="bubbleText"></span>
    <button class="x" id="bubbleX" aria-label="Dismiss"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="menu" id="menu" role="menu" aria-label="Pages and options"></div>
  <button class="fab" id="fab" aria-label="Pages and options" aria-expanded="false" aria-controls="menu">
    <svg class="ic-mark" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12c2.2 0 2.2-2 4.5-2s2.3 2 4.5 2 2.3-2 4.5-2 2.3 2 4.5 2"/><path d="M3 17c2.2 0 2.2-2 4.5-2s2.3 2 4.5 2 2.3-2 4.5-2 2.3 2 4.5 2" stroke="#F26522"/><path d="M8 7l4-4 4 4"/></svg>
    <svg class="ic-x" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<script>
/* =====================================================================
   SETTINGS — the only part you normally need to touch.
   ===================================================================== */
const CONFIG = {
  /* The Apps Script web app link (ends in /exec). */
  exec: 'https://script.google.com/macros/s/AKfycbwd0mgibtWbdPiGunQqDfnKWzkJy5CYauCy058dQL6948f0TZEdEvgZlN-ctI1llTrJ/exec',

  /* Which page opens first. '' = plain /exec (Project Monitoring).
     Other choices: 'duo', '2', 'mapping'. */
  startPage: '',

  /* LEAVE THIS EMPTY on a public site.
     If you type your VIP word here, everyone who finds this site gets in
     with no password, and the word itself is visible in the page source. */
  vipWord: ''
};

/* The pages. `param` is the word Code.gs expects after ?page=.
   `hidden` keeps a page reachable by link (?page=duo) without a menu entry. */
const PAGES = [
  { key:'monitor', param:'',        title:'Project Monitoring', tile:'navy',
    icon:'<path d="M3 5h18v11H3z"/><path d="M8 21h8"/><path d="M12 16v5"/><path d="m7 12 3-3 2 2 4-4"/>' },
  { key:'duo',     param:'duo',     title:'OKB Magazine',       tile:'orange', hidden:true,
    icon:'<path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7z"/>' },
  { key:'pdf',     param:'2',       title:'Generate PDF Report', tile:'orange',
    icon:'<path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M9 15h6"/><path d="M9 18h4"/>' },
  { key:'maps',    param:'mapping', title:'Generate PDF reports with maps and pictures', tile:'navy',
    icon:'<path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/>' }
];

const $ = id => document.getElementById(id);
const LS = { get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(_){ } } };
const svg = paths => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';

/* ---------- the link for a page ---------- */
function linkFor(page, hash){
  const q = [];
  if (page.param) q.push('page=' + encodeURIComponent(page.param));
  if (CONFIG.vipWord) q.push(encodeURIComponent(CONFIG.vipWord));
  let url = CONFIG.exec + (q.length ? '?' + q.join('&') : '');
  if (hash) url += '#' + hash.replace(/^#/, '');
  return url;
}

/* ---------- opening a page ----------
   Each page gets a brand-new frame. Re-pointing one frame would add the
   frame's own hops to the browser history, and the phone's Back button
   would walk through those instead of our pages. A fresh frame's first
   load adds nothing. */
let current = null, slowTimer = 0;
function mountFrame(url){
  const host = $('frameHost'), old = $('frame');
  const f = document.createElement('iframe');
  f.id = 'frame'; f.title = 'Oplan Kontra Baha';
  f.setAttribute('allow', 'clipboard-write *; clipboard-read *; fullscreen *; autoplay *; geolocation *');
  f.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
  f.addEventListener('load', () => {
    if (f !== $('frame')) return;
    f.classList.add('ready'); $('wait').classList.add('off'); $('loader').classList.remove('on'); clearTimeout(slowTimer);
  });
  f.src = url;
  if (old) old.remove();
  host.appendChild(f);
}
function open(page, hash, push){
  if (current === page && !hash && $('frame')) { closeMenu(); return; }
  current = page;
  $('wait').classList.remove('off'); $('waitSlow').classList.remove('show');
  $('waitWhat').textContent = 'Opening ' + page.title.replace(' · PDF', '') + '…';
  $('loader').classList.add('on');
  clearTimeout(slowTimer); slowTimer = setTimeout(() => $('waitSlow').classList.add('show'), 9000);
  mountFrame(linkFor(page, hash));
  document.title = (page.param ? page.title.replace(' · PDF', '') + ' · ' : '') + 'OKB';
  markCurrent();
  closeMenu();
  if (push) history.pushState({ page: page.key, hash: hash || '' }, '', page.param ? '?page=' + page.param + (hash ? '#' + hash : '') : location.pathname + (hash ? '#' + hash : ''));
}
function openInBrowser(){ if (current) window.open(linkFor(current, ''), '_blank', 'noopener'); closeMenu(); }
$('waitOpen').addEventListener('click', openInBrowser);
window.addEventListener('popstate', e => {
  const s = e.state || {};
  const p = (s.page && PAGES.find(x => x.key === s.page)) || PAGES[0];
  if (p !== current) open(p, s.hash || '', false);
});

/* ---------- the corner menu ---------- */
let menuOpen = false, dimTimer = 0;
function item(html, cls, onClick){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'item' + (cls ? ' ' + cls : ''); b.setAttribute('role', 'menuitem');
  b.innerHTML = html; b.addEventListener('click', onClick); return b;
}
function buildMenu(){
  const m = $('menu'); m.innerHTML = '';
  PAGES.filter(p => !p.hidden).forEach(p => {
    const b = item('<span class="tile ' + p.tile + '">' + svg(p.icon) + '</span><span class="lbl">' + p.title + '</span><span class="dot"></span>', '', () => open(p, '', true));
    b.dataset.key = p.key; m.appendChild(b);
  });
  const inst = item('<span class="tile gray">' + svg('<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/>') + '</span><span>Install as an app</span>', 'sep', doInstall);
  inst.id = 'installItem'; inst.hidden = true; m.appendChild(inst);
  m.appendChild(item('<span class="tile gray">' + svg('<path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>') + '</span><span>Open in browser</span>', 'sep', openInBrowser));
  /* the stagger: items nearest the button move first */
  const items = Array.from(m.children).reverse();
  items.forEach((el, i) => el.style.transitionDelay = (i * 35) + 'ms');
}
function markCurrent(){ Array.from($('menu').children).forEach(el => el.classList.toggle('current', !!current && el.dataset.key === current.key)); }
function setMenu(on){
  menuOpen = on;
  $('menu').classList.toggle('open', on); $('fab').classList.toggle('open', on); $('scrim').classList.toggle('on', on);
  $('fab').setAttribute('aria-expanded', String(on));
  clearTimeout(dimTimer);
  if (on) { $('fab').classList.remove('dim'); hideBubble(); }
  else dimTimer = setTimeout(() => $('fab').classList.add('dim'), 3500);
}
function closeMenu(){ if (menuOpen) setMenu(false); }
$('fab').addEventListener('click', () => setMenu(!menuOpen));
$('scrim').addEventListener('click', closeMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* ---------- install (Android / desktop Chrome) and the iPhone note ---------- */
let deferredPrompt = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function showBubble(html){ $('bubbleText').innerHTML = html; $('bubble').classList.add('on'); setTimeout(hideBubble, 14000); }
function hideBubble(){ $('bubble').classList.remove('on'); }
$('bubbleX').addEventListener('click', () => { hideBubble(); LS.set('okb.hint', 'no'); });
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e; $('installItem').hidden = false;
  if (LS.get('okb.hint') !== 'no' && !standalone) showBubble('Tap the round button to switch pages or <b>install OKB as an app</b>.');
});
async function doInstall(){
  closeMenu(); if (!deferredPrompt) return;
  deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch(_){}
  deferredPrompt = null; $('installItem').hidden = true;
}
window.addEventListener('appinstalled', () => { $('installItem').hidden = true; hideBubble(); });
if (isIOS && !standalone && LS.get('okb.hint') !== 'no') {
  setTimeout(() => showBubble('Add OKB to your home screen: in Safari tap <b>Share</b>, then <b>Add to Home Screen</b>. The round button switches pages.'), 2500);
}

/* ---------- the shell works offline; the live pages still need internet ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

/* ---------- start: straight into the web app ---------- */
buildMenu();
(function start(){
  const want = new URLSearchParams(location.search).get('page');
  const hash = location.hash.replace(/^#/, '');
  const alias = { index2:'2', map:'mapping', device:'duo', showcase:'duo', monitor:'' };
  const wantParam = want == null ? CONFIG.startPage : (alias.hasOwnProperty(want) ? alias[want] : want);
  const p = PAGES.find(x => x.param === wantParam) || PAGES[0];
  history.replaceState({ page: p.key, hash }, '', location.href);
  open(p, hash, false);
  dimTimer = setTimeout(() => $('fab').classList.add('dim'), 4000);
})();
</script>
</body>
</html>
